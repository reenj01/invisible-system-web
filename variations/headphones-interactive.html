<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Headphones Work</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0066ff;
            --secondary: #ff006e;
            --accent: #ffbe0b;
            --dark: #000000;
            --dark-2: #f5f5f5;
            --dark-3: #ffffff;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #ffffff;
            color: #000000;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--primary);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
            opacity: 0.4;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            50% { transform: translate(50px, -100px) scale(1.5); opacity: 0.8; }
            90% { opacity: 1; }
        }

        .container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding: 20px;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: rgba(0, 0, 0, 0.6);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Main interactive area */
        .interactive-area {
            position: relative;
            width: 100%;
            height: 500px;
            margin: 60px auto;
        }

        /* Center 3D model */
        .headphone-model {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            z-index: 10;
            animation: pulse 3s ease-in-out infinite;
        }

        .headphone-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate3d 20s linear infinite;
        }

        /* Headphone visual */
        .headphone-shape {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
        }

        .headband {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 80px;
            border: 4px solid var(--primary);
            border-bottom: none;
            border-radius: 100px 100px 0 0;
            background: linear-gradient(180deg, rgba(0, 102, 255, 0.1), transparent);
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.3), inset 0 0 15px rgba(0, 102, 255, 0.15);
        }

        .ear-cup {
            position: absolute;
            width: 50px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 30px rgba(0, 102, 255, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(0, 102, 255, 0.3);
        }

        .ear-cup.left {
            bottom: 0;
            left: 0;
        }

        .ear-cup.right {
            bottom: 0;
            right: 0;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }

        @keyframes rotate3d {
            0% { transform: rotateY(0deg) rotateX(10deg); }
            100% { transform: rotateY(360deg) rotateX(10deg); }
        }

        /* Info points around the model */
        .info-point {
            position: absolute;
            cursor: pointer;
            z-index: 5;
            animation: fadeIn 1s ease-out backwards;
        }

        .info-point:nth-child(1) { animation-delay: 0.2s; }
        .info-point:nth-child(2) { animation-delay: 0.4s; }
        .info-point:nth-child(3) { animation-delay: 0.6s; }
        .info-point:nth-child(4) { animation-delay: 0.8s; }
        .info-point:nth-child(5) { animation-delay: 1s; }

        .point-connector {
            position: absolute;
            background: var(--primary);
            transform-origin: left center;
            box-shadow: 0 0 8px rgba(0, 102, 255, 0.4);
        }

        .point-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.6);
            animation: dotPulse 2s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .info-point:hover .point-dot {
            transform: scale(1.3);
            box-shadow: 0 0 25px rgba(0, 102, 255, 0.8);
        }

        @keyframes dotPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 102, 255, 0.6); }
            50% { box-shadow: 0 0 30px rgba(0, 102, 255, 0.8), 0 0 40px rgba(0, 102, 255, 0.5); }
        }

        .point-label {
            position: absolute;
            background: rgba(255, 255, 255, 0.98);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            border: 2px solid rgba(0, 102, 255, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            color: #000000;
        }

        .info-point:hover .point-label {
            background: rgba(0, 102, 255, 0.1);
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .step-number {
            display: inline-block;
            width: 22px;
            height: 22px;
            background: var(--primary);
            color: #ffffff;
            border-radius: 50%;
            text-align: center;
            line-height: 22px;
            font-weight: 900;
            margin-right: 8px;
            font-size: 0.7rem;
        }

        .step-text {
            color: #000000;
        }

        /* Position each info point */
        .info-point:nth-child(1) {
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
        }

        .info-point:nth-child(1) .point-connector {
            width: 2px;
            height: 115px;
            top: 8px;
            left: 7px;
            background: var(--primary);
        }

        .info-point:nth-child(1) .point-label {
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
        }

        .info-point:nth-child(2) {
            top: 20%;
            right: 10%;
        }

        .info-point:nth-child(2) .point-connector {
            width: 120px;
            height: 2px;
            top: 7px;
            right: 8px;
            background: var(--primary);
            transform: rotate(-35deg);
            transform-origin: right center;
        }

        .info-point:nth-child(2) .point-label {
            top: -10px;
            right: -145px;
        }

        .info-point:nth-child(3) {
            bottom: 20%;
            right: 10%;
        }

        .info-point:nth-child(3) .point-connector {
            width: 120px;
            height: 2px;
            bottom: 7px;
            right: 8px;
            background: var(--primary);
            transform: rotate(35deg);
            transform-origin: right center;
        }

        .info-point:nth-child(3) .point-label {
            bottom: -10px;
            right: -130px;
        }

        .info-point:nth-child(4) {
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
        }

        .info-point:nth-child(4) .point-connector {
            width: 2px;
            height: 115px;
            bottom: 8px;
            left: 7px;
            background: var(--primary);
        }

        .info-point:nth-child(4) .point-label {
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
        }

        .info-point:nth-child(5) {
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
        }

        .info-point:nth-child(5) .point-connector {
            width: 120px;
            height: 2px;
            top: 7px;
            left: 8px;
            background: var(--primary);
        }

        .info-point:nth-child(5) .point-label {
            top: -10px;
            left: -130px;
        }

        /* Popup overlay */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .popup-overlay.active {
            display: flex;
        }

        .popup-content {
            position: relative;
            background: rgba(255, 255, 255, 0.98);
            border: 2px solid var(--primary);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2), 0 0 80px rgba(0, 102, 255, 0.2);
            animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 0, 110, 0.2);
            border: 2px solid var(--secondary);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .close-btn:hover {
            background: var(--secondary);
            transform: rotate(90deg) scale(1.1);
        }

        .close-btn::before,
        .close-btn::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 2px;
            background: #fff;
        }

        .close-btn::before {
            transform: rotate(45deg);
        }

        .close-btn::after {
            transform: rotate(-45deg);
        }

        .popup-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .popup-step-number {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            font-weight: 900;
            margin-right: 20px;
            box-shadow: 0 0 25px rgba(0, 102, 255, 0.4);
            color: #ffffff;
        }

        .popup-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.3;
        }

        .popup-description {
            color: rgba(0, 0, 0, 0.85);
            line-height: 1.7;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .popup-detail {
            background: rgba(0, 102, 255, 0.05);
            border-left: 3px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .detail-label {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.85rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-text {
            color: rgba(0, 0, 0, 0.75);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from { 
                opacity: 0;
                transform: translateY(-20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Instruction text */
        .instruction {
            text-align: center;
            color: rgba(0, 0, 0, 0.5);
            font-size: 0.85rem;
            margin-top: 40px;
            animation: fadeIn 1.5s ease-out 1.5s backwards;
        }

        .tap-icon {
            display: inline-block;
            animation: tap 1.5s ease-in-out infinite;
        }

        @keyframes tap {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <!-- Animated background -->
    <div class="bg-particles" id="particles"></div>

    <div class="container">
        <header>
            <h1>HOW HEADPHONES WORK</h1>
            <p class="subtitle">EXPLORE THE SCIENCE OF SOUND</p>
        </header>

        <div class="interactive-area">
            <!-- Center 3D Headphone Model -->
            <div class="headphone-model">
                <div class="headphone-3d">
                    <div class="headphone-shape">
                        <div class="headband"></div>
                        <div class="ear-cup left"></div>
                        <div class="ear-cup right"></div>
                    </div>
                </div>
            </div>

            <!-- Info Points -->
            <div class="info-point" data-step="1">
                <div class="point-connector"></div>
                <div class="point-dot"></div>
                <div class="point-label">
                    <span class="step-number">1</span>
                    <span class="step-text">Sound Input</span>
                </div>
            </div>

            <div class="info-point" data-step="2">
                <div class="point-connector"></div>
                <div class="point-dot"></div>
                <div class="point-label">
                    <span class="step-number">2</span>
                    <span class="step-text">Electrical Signal</span>
                </div>
            </div>

            <div class="info-point" data-step="3">
                <div class="point-connector"></div>
                <div class="point-dot"></div>
                <div class="point-label">
                    <span class="step-number">3</span>
                    <span class="step-text">Magnetic Field</span>
                </div>
            </div>

            <div class="info-point" data-step="4">
                <div class="point-connector"></div>
                <div class="point-dot"></div>
                <div class="point-label">
                    <span class="step-number">4</span>
                    <span class="step-text">Diaphragm Movement</span>
                </div>
            </div>

            <div class="info-point" data-step="5">
                <div class="point-connector"></div>
                <div class="point-dot"></div>
                <div class="point-label">
                    <span class="step-number">5</span>
                    <span class="step-text">Sound Waves</span>
                </div>
            </div>
        </div>

        <p class="instruction">
            <span class="tap-icon">👆</span> Tap any step to explore
        </p>
    </div>

    <!-- Popup Overlay -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-content" id="popupContent">
            <div class="close-btn" id="closeBtn"></div>
            <div class="popup-header">
                <div class="popup-step-number" id="popupStepNumber">1</div>
                <h2 class="popup-title" id="popupTitle">Sound Input</h2>
            </div>
            <p class="popup-description" id="popupDescription"></p>
            <div class="popup-detail">
                <div class="detail-label">Key Concept</div>
                <div class="detail-text" id="popupDetail"></div>
            </div>
        </div>
    </div>

    <script>
        // Step content data
        const stepData = {
            1: {
                title: "Sound Input",
                description: "Audio travels from your device through a cable or wireless connection. The digital or analog audio signal contains all the information needed to recreate the original sound.",
                detail: "Audio signals can be analog (continuous electrical waves) or digital (discrete binary data). Modern headphones often convert digital signals to analog before processing."
            },
            2: {
                title: "Electrical Signal",
                description: "The audio signal is converted into an electrical current that flows through the headphone's internal wiring. This current varies in strength and frequency based on the sound being played.",
                detail: "The varying electrical current mirrors the pattern of the original sound wave. Higher volumes create stronger currents, while different frequencies create different oscillation patterns."
            },
            3: {
                title: "Magnetic Field",
                description: "The electrical current flows through a voice coil (a tightly wound wire) positioned near a permanent magnet. This creates a fluctuating magnetic field that interacts with the permanent magnet.",
                detail: "When electrical current flows through the coil, it becomes an electromagnet. The interaction between this electromagnet and the permanent magnet creates a push-pull force."
            },
            4: {
                title: "Diaphragm Movement",
                description: "The voice coil is attached to a thin diaphragm (cone). As the magnetic field pushes and pulls the coil, the diaphragm vibrates rapidly back and forth, matching the pattern of the electrical signal.",
                detail: "The diaphragm acts like a tiny speaker cone, moving air. Fast vibrations create high-pitched sounds, while slow vibrations create low-pitched sounds. The distance of movement determines volume."
            },
            5: {
                title: "Sound Waves",
                description: "As the diaphragm vibrates, it pushes and pulls the air molecules around it, creating pressure waves. These pressure waves travel through the air and into your ear canal, where they're perceived as sound.",
                detail: "Sound waves are compressions and rarefactions of air molecules. When they reach your eardrum, they cause it to vibrate, which your brain interprets as sound. This completes the journey from digital signal to perceived audio."
            }
        };

        // Generate background particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (15 + Math.random() * 10) + 's';
            particlesContainer.appendChild(particle);
        }

        // Popup functionality
        const popupOverlay = document.getElementById('popupOverlay');
        const popupContent = document.getElementById('popupContent');
        const closeBtn = document.getElementById('closeBtn');
        const popupStepNumber = document.getElementById('popupStepNumber');
        const popupTitle = document.getElementById('popupTitle');
        const popupDescription = document.getElementById('popupDescription');
        const popupDetail = document.getElementById('popupDetail');
        const infoPoints = document.querySelectorAll('.info-point');

        // Open popup
        infoPoints.forEach(point => {
            point.addEventListener('click', function() {
                const step = this.dataset.step;
                const data = stepData[step];
                
                popupStepNumber.textContent = step;
                popupTitle.textContent = data.title;
                popupDescription.textContent = data.description;
                popupDetail.textContent = data.detail;
                
                popupOverlay.classList.add('active');
            });
        });

        // Close popup - close button
        closeBtn.addEventListener('click', function() {
            popupOverlay.classList.remove('active');
        });

        // Close popup - click outside
        popupOverlay.addEventListener('click', function(e) {
            if (e.target === popupOverlay) {
                popupOverlay.classList.remove('active');
            }
        });

        // Prevent clicks inside popup from closing
        popupContent.addEventListener('click', function(e) {
            e.stopPropagation();
        });
    </script>
</body>
</html>
